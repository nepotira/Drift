name: Test Install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-15-intel
    steps:
      - name: Test brew non-qt dependencies
        run: |
          brew install ffmpeg zstd openssl@3 sound-touch ninja

      - name: Install Qt via aqtinstall
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtmultimedia qtimageformats'

      - name: Verify tools
        run: |
          qmake --version
          ffmpeg -version | head -n 2
